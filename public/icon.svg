  <!-- Glass Shimmer -->
  <rect x="116" y="116" width="120" height="120" rx="8" fill="#2563eb" fill-opacity="0.35"/>
  <rect x="276" y="116" width="120" height="120" rx="8" fill="#2563eb" fill-opacity="0.25"/>
